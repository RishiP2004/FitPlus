{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="form-card">
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <form method="post" action="{{ action }}" class="actions">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="button danger">{{ button }}</button>
    <a class="button secondary" href="{{ cancel }}">Cancel</a>
  </form>
</div>
{% endblock %}
