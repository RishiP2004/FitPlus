name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=60

  test-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitplus
          POSTGRES_PASSWORD: fitplus
          POSTGRES_DB: fitplus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fitplus"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fitplus:fitplus@localhost:5432/fitplus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
